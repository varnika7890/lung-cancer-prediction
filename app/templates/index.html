<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lung Cancer Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Lung Cancer Prediction System</h2>

    <form action="/predict" method="POST">

        <label>Gender</label>
        <select name="gender" required>
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select>

        <label>Age</label>
        <input type="number" name="age" required>

        <label>Smoking</label>
        <select name="smoking">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Yellow Fingers</label>
        <select name="yellow_fingers">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Anxiety</label>
        <select name="anxiety">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Peer Pressure</label>
        <select name="peer_pressure">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Chronic Disease</label>
        <select name="chronic_disease">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Fatigue</label>
        <select name="fatigue">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Allergy</label>
        <select name="allergy">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Wheezing</label>
        <select name="wheezing">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Alcohol Consuming</label>
        <select name="alcohol">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Coughing</label>
        <select name="coughing">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Shortness of Breath</label>
        <select name="shortness_of_breath">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Swallowing Difficulty</label>
        <select name="swallowing_difficulty">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <label>Chest Pain</label>
        <select name="chest_pain">
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <h3 class="result">{{ prediction_text }}</h3>
    {% endif %}
</div>

</body>
</html>
